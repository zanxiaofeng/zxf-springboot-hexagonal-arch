spring:
  application:
    name: springboot-hexagonal-arch
  datasource:
    url: jdbc:mysql://localhost:3306/hexagonal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none        # 表结构由 Flyway 管理
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100   # 分页安全：全局页大小上限
        default-page-size: 20

server:
  error:
    include-message: never       # 生产安全：不回显异常消息/堆栈/绑定错误
    include-stacktrace: never
    include-binding-errors: never

app:
  downstream:
    notification:
      base-url: http://localhost:9000
